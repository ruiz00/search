<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Google Advanced Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="header">
            <a href="index.html">Google Search</a>
            <a href="images.html">Images Search</a>
        </div>
        
        <div class="advanced-container">
            <h3>Advanced Search</h3>
            <form action="https://www.google.com/search" method="GET">
                <div class="form-section">
                    <h4>Find pages with...</h4>
                    <div class="form-group">
                        <label>all these words:</label>
                        <input type="text" name="as_q" class="advanced-input">
                        <span class="hint">Type the important words: </span>
                    </div>
                    
                    <div class="form-group">
                        <label>this exact word or phrase:</label>
                        <input type="text" name="as_epq" class="advanced-input">
                        <span class="hint">Put exact words in quotes: </span>
                    </div>
                    
                    <div class="form-group">
                        <label>any of these words:</label>
                        <input type="text" name="as_oq" class="advanced-input">
                        <span class="hint">Type OR between all the words you want:</span>
                    </div>
                    
                    <div class="form-group">
                        <label>none of these words:</label>
                        <input type="text" name="as_eq" class="advanced-input">
                        <span class="hint">Put a minus sign just before words you don't want:</span>
                    </div>
                </div>
            </form>
        </div>
    </body>
</html>
