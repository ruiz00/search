<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <a href="index.html">Google Search</a>
        <a href="images.html">Images</a>
    </div>
    
    <div class="advanced-container">
        <h3>Advanced Search</h3>
        
        <form action="https://www.google.com/search" method="GET">
            <div class="form-group">
                <label>Find pages with... "all these words:"</label>
                <input type="text" name="as_q" class="advanced-input">
            </div>
            
            <div class="form-group">
                <label>Find pages with... "this exact word or phrase:"</label>
                <input type="text" name="as_epq" class="advanced-input">
            </div>
            
            <div class="form-group">
                <label>Find pages with... "any of these words:"</label>
                <input type="text" name="as_oq" class="advanced-input">
            </div>
            
            <div class="form-group">
                <label>Find pages with... "none of these words:"</label>
                <input type="text" name="as_eq" class="advanced-input">
            </div>
            
            <input type="submit" value="Advanced Search" class="advanced-button">
        </form>
    </div>
</body>
</html>
