<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google image Search</title>
    <link href="style.css" rel="stylesheet">
    
</head>
<body>
    <div class="header">
        <a href="index.html">Google Search</a>
        <a href="advanced.html">Advanced search</a> 
    </div>
    
    <div class="container">
        <img  alt="Google Images" src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" >
        
        <form action="https://google.com/images">
            <input type="text" name="q" class="search-bar" placeholder="Image search">
            <div class="buttons">
                <input type="submit" value="Google Image Search" class="search-button">
            </div>
        </form>
    </div> 

</body>
</html>
